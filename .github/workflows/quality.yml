name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install quality tools
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --select F,UP,B core tests Brain/brain.py Vision/Vbrain.py Vision/MVbrain.py TextToSpeech/Fast_DF_TTS.py TextToImage/gen_image.py NetHyTechSTT/listen.py Automation/open_App.py Automation/Automation_Brain.py Features/create_file.py Whatsapp_automation/wa.py co_brain.py jarvis.py

      - name: Unit tests
        run: pytest
